<!DOCTYPE html>
<html lang="it">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lab Inventory PWA</title>
    <meta name="theme-color" content="#2563eb" />
    <script type="module" crossorigin src="/assets/index-DKMt0-S-.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-BQwW4gPO.css">
  <link rel="manifest" href="/manifest.webmanifest"></head>
  <body class="bg-gray-50 dark:bg-brand-800 text-gray-900 antialiased">
    <div id="root"></div>
    <script>
      // Custom service worker registration with dynamic base path detection
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          const path = window.location.pathname;
          const isGitHubPages = path.startsWith('/lab-inventory-app');
          const swPath = isGitHubPages ? '/lab-inventory-app/sw.js' : '/sw.js';
          const scope = isGitHubPages ? '/lab-inventory-app/' : '/';
          navigator.serviceWorker.register(swPath, { scope: scope });
        });
      }
    </script>
  </body>
</html>
